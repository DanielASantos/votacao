spring:
  application:
    name: votacao

  # Configuração da Conexão com o PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/cooperativa_votacao
    username: ${DB_USER:votacao_user}
    password: ${DB_PASSWORD:votacao_pass_2026}
    driver-class-name: org.postgresql.Driver

  # Configuração do JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: validate

  # Configuração do Flyway (Migration)
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public

  #Configuração do OpenAPI (Swagger)
  springdoc:
    swagger-ui:
      path: /swagger-ui.html

      operationsSorter: method
      tagsSorter: alpha

    api-docs:
      path: /v3/api-docs

  app:
    integration:
      user-info:
        url: ${USER_INFO_URL:https://user-info.herokuapp.com}

  logging:
    structured:
      json:
        enabled: true