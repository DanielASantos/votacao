spring:
  application:
    name: votacao

  # Configuração da Conexão com o PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/cooperativa_votacao
    username: ${DB_USER:votacao_user}
    password: ${DB_PASSWORD:votacao_pass_2026}
    driver-class-name: org.postgresql.Driver

  # Configuração do JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: validate

  # Configuração do Flyway (Migration)
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
